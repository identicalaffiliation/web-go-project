server {
    listen 80;
    server_name _;

    # CORS — handle preflight OPTIONS without auth
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-User-Role" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0;
        add_header Content-Type "text/plain; charset=utf-8";
        return 204;
    }

    # Always add CORS headers on actual responses
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Expose-Headers "X-User-Role" always;

    # Internal auth subrequest — not accessible from outside
    location = /_auth_validate {
        internal;

        proxy_pass http://auth-service:8080/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }

    # Auth failure handlers
    error_page 401 = @auth_unauthorized;
    error_page 403 = @auth_forbidden;

    location @auth_unauthorized {
        default_type application/json;
        return 401 '{"error": "unauthorized"}';
    }

    location @auth_forbidden {
        default_type application/json;
        return 403 '{"error": "forbidden"}';
    }

    # Catalog API — auth_request runs first, then proxies to catalog-service
    location /api/v1/ {
        auth_request /_auth_validate;

        # Capture role from auth service response header
        auth_request_set $user_role $upstream_http_x_user_role;

        # Forward role + original Authorization to catalog service
        proxy_set_header X-User-Role $user_role;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://catalog-service:8080;
    }
}
