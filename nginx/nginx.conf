worker_processes auto;

events {
    # на каждый проксируемый запрос - 2 соединения (клиент + upstream);
    # под 2000+ rps от k6 1024 на воркер не хватает
    worker_connections 4096;
}

http {
    log_format gateway '$remote_addr "$request" $status $body_bytes_sent '
                       'user=$user_id role=$user_role '
                       'rt=$request_time urt=$upstream_response_time ua=$upstream_addr';
    access_log /dev/stdout gateway;
    error_log  /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;

    # загрузка картинок товара
    client_max_body_size 10m;

    # Балансировка по репликам (deploy.replicas в compose). Имя сервиса в DNS docker
    # отдаёт IP всех реплик; resolve перечитывает их каждые valid=10s, поэтому
    # пересозданная или добавленная через --scale реплика подхватывается без reload.
    # Для resolve нужны resolver и общая zone upstream'а.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    # least_conn: запрос уходит в реплику с меньшим числом активных соединений,
    # медленный запрос (сага, загрузка) не тормозит соседей так, как при round-robin.
    # max_fails/fail_timeout: упавшая реплика выводится из ротации на 10s.
    upstream auth_service {
        zone auth_service 64k;
        least_conn;
        server auth-service:8080 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream catalog_service {
        zone catalog_service 64k;
        least_conn;
        server catalog-service:8080 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream profile_service {
        zone profile_service 64k;
        least_conn;
        server profile-service:8000 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream orders_service {
        zone orders_service 64k;
        least_conn;
        server orders-service:8080 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # зоны rate limit, собираются из nginx/templates/rate-limits.conf.template
    include /etc/nginx/conf.d/rate-limits.conf;

    upstream frontend {
        server frontend:80;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # значения по умолчанию для публичных ручек, где auth_request не вызывается.
        # на защищённых их перезаписывает auth_request_set
        set $user_id   "";
        set $user_role "";

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        # реплика недоступна или упала до ответа - пробуем следующую.
        # POST/PATCH повторно не шлются (non_idempotent не включён): заказ не создастся дважды
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 2s;

        # Заголовки пользователя выставляет только auth. Значение клиента всегда
        # перетирается: на публичных ручках пустым, на защищённых — ответом auth.
        proxy_set_header X-User-Id   $user_id;
        proxy_set_header X-User-Role $user_role;

        location = /_auth {
            internal;

            proxy_pass http://auth_service/api/v1/auth/validate;

            # auth нужен только заголовок Authorization, тело не передаём
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URI    $request_uri;

            proxy_connect_timeout 2s;
            proxy_read_timeout    3s;
        }

        # Rate limit: burst - сколько запросов сверх rate пропускается сразу (nodelay, без очереди),
        # всё, что выше, сразу получает 429 и до бэкенда не доходит
        limit_req_status    429;
        limit_req_log_level warn;

        error_page 401 = @unauthorized;
        error_page 403 = @forbidden;
        error_page 429 = @rate_limited;

        location @rate_limited {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"message":"too many requests"}';
        }

        location @unauthorized {
            default_type application/json;
            add_header WWW-Authenticate 'Bearer' always;
            return 401 '{"message":"unauthorized"}';
        }

        location @forbidden {
            default_type application/json;
            return 403 '{"message":"forbidden"}';
        }


        # validate — внутренняя ручка шлюза, снаружи её не отдаём
        location = /api/v1/auth/validate {
            return 404;
        }

        location = /api/v1/auth/register {
            limit_req zone=rl_auth     burst=30 nodelay;
            limit_req zone=register_ip burst=10 nodelay;

            proxy_pass http://auth_service;
        }

        location /api/v1/auth/ {
            limit_req zone=rl_auth burst=30 nodelay;

            proxy_pass http://auth_service;
        }


        # swagger UI каталога публичный; префикс длиннее /api/v1/catalog/,
        # поэтому выигрывает у защищённого location ниже
        location /api/v1/catalog/swagger/ {
            limit_req zone=rl_catalog_read burst=1000 nodelay;

            proxy_pass http://catalog_service;
        }

        # GET каталога (страницы с курсором) — публичный, без авторизации.
        # Остальные методы (создание товара) — через auth.
        location = /api/v1/catalog {
            # error_page на уровне location отменяет наследование серверных,
            # поэтому 401/403 повторяем здесь
            error_page 401 = @unauthorized;
            error_page 403 = @forbidden;
            error_page 418 = @catalog_public;
            error_page 429 = @rate_limited;

            if ($request_method = GET) {
                return 418;
            }

            # GET сюда не доходит (return 418 срабатывает раньше limit_req), его лимитирует @catalog_public
            limit_req zone=rl_catalog_write   burst=30 nodelay;
            limit_req zone=catalog_write_user burst=30 nodelay;

            auth_request /_auth;
            auth_request_set $user_id   $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            proxy_pass http://catalog_service;
        }

        location @catalog_public {
            limit_req zone=rl_catalog_read burst=1000 nodelay;

            proxy_pass http://catalog_service;
        }

        # товар по id, загрузка картинки — только с авторизацией.
        # Зоны выбираются по методу через ключ: GET (карточка, отзывы) считает только read,
        # POST (картинка, лайк, отзыв) - write и лимит на клиента. Пустой ключ nginx не считает
        location /api/v1/catalog/ {
            limit_req zone=rl_catalog_read    burst=1000 nodelay;
            limit_req zone=rl_catalog_write   burst=30   nodelay;
            limit_req zone=catalog_write_user burst=30 nodelay;

            auth_request /_auth;
            auth_request_set $user_id   $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            proxy_pass http://catalog_service;
        }


        location = /api/v1/profiles/business {
            limit_req zone=rl_profile           burst=30 nodelay;
            limit_req zone=business_create_user burst=5  nodelay;

            auth_request /_auth;
            auth_request_set $user_id   $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            proxy_pass http://profile_service;
        }

        location /api/v1/profiles {
            limit_req zone=rl_profile burst=30 nodelay;

            auth_request /_auth;
            auth_request_set $user_id   $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            proxy_pass http://profile_service;
        }


        # orders отдаёт ручки от корня (/orders, /swagger/*), поэтому префикс
        # /api/v1 срезаем в proxy_pass
        location /api/v1/orders/swagger/ {
            limit_req zone=rl_orders burst=30 nodelay;

            proxy_pass http://orders_service/swagger/;
        }

        # создание заказа — только с авторизацией, роль проверяет сам orders
        location = /api/v1/orders {
            limit_req zone=rl_orders          burst=30 nodelay;
            limit_req zone=orders_create_user burst=10 nodelay;

            auth_request /_auth;
            auth_request_set $user_id   $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            proxy_pass http://orders_service/orders;
        }


        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        # неизвестные ручки API — json 404, а не index.html фронта
        location /api/ {
            default_type application/json;
            return 404 '{"message":"not found"}';
        }

        # всё остальное — SPA фронтенда
        location / {
            proxy_pass http://frontend;
        }
    }
}
