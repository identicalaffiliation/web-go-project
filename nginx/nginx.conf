worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format gateway '$remote_addr "$request" $status $body_bytes_sent '
                       'user=$user_id role=$user_role '
                       'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout gateway;
    error_log  /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;

    # загрузка картинок товара
    client_max_body_size 10m;

    upstream auth_service {
        server auth-service:8080;
        keepalive 16;
    }

    upstream catalog_service {
        server catalog-service:8080;
        keepalive 16;
    }

    upstream profile_service {
        server profile-service:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # значения по умолчанию для публичных ручек, где auth_request не вызывается.
        # на защищённых их перезаписывает auth_request_set
        set $user_id   "";
        set $user_role "";

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        # Заголовки пользователя выставляет только auth. Значение клиента всегда
        # перетирается: на публичных ручках пустым, на защищённых — ответом auth.
        proxy_set_header X-User-Id   $user_id;
        proxy_set_header X-User-Role $user_role;

        location = /_auth {
            internal;

            proxy_pass http://auth_service/api/v1/auth/validate;

            # auth нужен только заголовок Authorization, тело не передаём
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URI    $request_uri;

            proxy_connect_timeout 2s;
            proxy_read_timeout    3s;
        }

        error_page 401 = @unauthorized;
        error_page 403 = @forbidden;

        location @unauthorized {
            default_type application/json;
            add_header WWW-Authenticate 'Bearer' always;
            return 401 '{"message":"unauthorized"}';
        }

        location @forbidden {
            default_type application/json;
            return 403 '{"message":"forbidden"}';
        }


        # validate — внутренняя ручка шлюза, снаружи её не отдаём
        location = /api/v1/auth/validate {
            return 404;
        }

        location /api/v1/auth/ {
            proxy_pass http://auth_service;
        }


        location /api/v1/swagger/ {
            proxy_pass http://catalog_service;
        }

        # GET каталога (страницы с курсором) — публичный, без авторизации.
        # Остальные методы (создание товара) — через auth.
        location = /api/v1/catalog {
            # error_page на уровне location отменяет наследование серверных,
            # поэтому 401/403 повторяем здесь
            error_page 401 = @unauthorized;
            error_page 403 = @forbidden;
            error_page 418 = @catalog_public;

            if ($request_method = GET) {
                return 418;
            }

            auth_request /_auth;
            auth_request_set $user_id   $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            proxy_pass http://catalog_service;
        }

        location @catalog_public {
            proxy_pass http://catalog_service;
        }

        # товар по id, загрузка картинки — только с авторизацией
        location /api/v1/catalog/ {
            auth_request /_auth;
            auth_request_set $user_id   $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            proxy_pass http://catalog_service;
        }


        location /api/v1/profiles {
            auth_request /_auth;
            auth_request_set $user_id   $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            proxy_pass http://profile_service;
        }


        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        location / {
            default_type application/json;
            return 404 '{"message":"not found"}';
        }
    }
}
