postgres:
  master:
    max_conns: 20
    min_conns: 2
    max_conn_lifetime: 30m
    max_conn_idle_time: 5m
    health_check_period: 30s
    connect_timeout: 5s
  replica:
    max_conns: 20
    min_conns: 2
    max_conn_lifetime: 30m
    max_conn_idle_time: 5m
    health_check_period: 30s
    connect_timeout: 5s

grpc:
  host: 0.0.0.0
  port: 50052

server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 5s
  write_timeout: 5s
  idle_timeout: 30s
  shutdown_timeout: 30s

temporal:
  host_port: shop-temporal:7233
  namespace: default
  task_queue: orders
  max_concurrent_activities: 50

catalog:
  addr: catalog-service:50051

operation_duration: 30s
