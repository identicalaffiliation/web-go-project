server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 5s
  write_timeout: 5s
  idle_timeout: 30s
  shutdown_timeout: 30s

grpc:
  host: 0.0.0.0
  port: 50051

feedbacks_grpc:
  host: 0.0.0.0
  port: 50052

s3:
  external_host: localhost
  internal_host: shop-minio
  port: 9000
  bucket: products
  expiration: 900s

cache:
  host: shop-redis
  port: 6379
  ttl: 600s

outbox:
  stock:
    tick: 250ms
    limit: 100
    topic: stock.created
  likes:
    tick: 250ms
    limit: 100
    topic: like.events
kafka:
    brokers: [shop-kafka:9092]
    batch_size: 100
    batch_timeout: 50ms
    write_timeout: 5s

operation_duration: 30s