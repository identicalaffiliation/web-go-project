kafka:
    brokers: [shop-kafka:9092]
    consume_topic: stock.created
    group_id: inventory-service
    queue_capacity: 50
    read_batch_timeout: 500ms
    workers: 3

temporal:
    host_port: shop-temporal:7233
    namespace: default
    task_queue: inventory
    max_concurrent_activities: 50

operation_duration: 30s