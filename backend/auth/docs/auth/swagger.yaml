basePath: /api/v1/auth
definitions:
  internal_adapters_rest.errorResponse:
    properties:
      error:
        example: invalid request body
        type: string
    type: object
  internal_adapters_rest.loginRequest:
    properties:
      email:
        example: user@example.com
        format: email
        type: string
      password:
        example: your-password-here
        type: string
    required:
    - email
    - password
    type: object
  internal_adapters_rest.logoutRequest:
    properties:
      refresh_token:
        example: <refresh-token>
        type: string
    type: object
  internal_adapters_rest.refreshRequest:
    properties:
      refresh_token:
        example: <refresh-token>
        type: string
    type: object
  internal_adapters_rest.registerRequest:
    properties:
      email:
        example: user@example.com
        format: email
        type: string
      password:
        example: your-password-here
        maxLength: 72
        minLength: 8
        type: string
      role:
        enum:
        - customer
        - business
        example: customer
        type: string
    required:
    - email
    - password
    - role
    type: object
  internal_adapters_rest.registerResponse:
    properties:
      created_at:
        type: string
      email:
        example: user@example.com
        format: email
        type: string
      id:
        example: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
        format: uuid
        type: string
      role:
        enum:
        - customer
        - business
        example: customer
        type: string
    type: object
  internal_adapters_rest.tokenPairResponse:
    properties:
      access_expires_at:
        type: string
      access_token:
        example: <access-jwt>
        type: string
      refresh_expires_at:
        type: string
      refresh_token:
        example: <refresh-token>
        type: string
    type: object
info:
  contact: {}
  description: Registration, login and JWT access/refresh token management.
  title: Auth Service API
  version: "1.0"
paths:
  /login:
    post:
      consumes:
      - application/json
      description: 'Checks credentials and returns an access JWT (use it as "Authorization:
        Bearer <token>") and a refresh token.'
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_rest.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_adapters_rest.tokenPairResponse'
        "400":
          description: Invalid body, email or password missing
          schema:
            $ref: '#/definitions/internal_adapters_rest.errorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/internal_adapters_rest.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_adapters_rest.errorResponse'
      summary: Log in
      tags:
      - auth
  /logout:
    post:
      consumes:
      - application/json
      description: 'Revokes the refresh token. Idempotent: an unknown token also gives
        204.'
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_rest.logoutRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Token revoked
        "400":
          description: Invalid body
          schema:
            $ref: '#/definitions/internal_adapters_rest.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_adapters_rest.errorResponse'
      summary: Log out
      tags:
      - auth
  /refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a valid refresh token for a new pair. The old refresh
        token is revoked (rotation).
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_rest.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_adapters_rest.tokenPairResponse'
        "400":
          description: Invalid body
          schema:
            $ref: '#/definitions/internal_adapters_rest.errorResponse'
        "401":
          description: Refresh token unknown, expired or revoked
          schema:
            $ref: '#/definitions/internal_adapters_rest.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_adapters_rest.errorResponse'
      summary: Refresh tokens
      tags:
      - auth
  /register:
    post:
      consumes:
      - application/json
      description: 'Creates a user with the given role. Password: 8-72 bytes, not
        blank.'
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_rest.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_adapters_rest.registerResponse'
        "400":
          description: Invalid body, email, password or role
          schema:
            $ref: '#/definitions/internal_adapters_rest.errorResponse'
        "409":
          description: Email already taken
          schema:
            $ref: '#/definitions/internal_adapters_rest.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_adapters_rest.errorResponse'
      summary: Register a new user
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the JWT.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
