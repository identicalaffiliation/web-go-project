server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # хешированные ассеты vite можно кешировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: все неизвестные пути отдаём на index.html (react-router)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
