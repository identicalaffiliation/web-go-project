name: CI

on:
  pull_request:

jobs:
  commit-check:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          commits=$(git rev-list \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}")

          for commit in $commits; do
            message=$(git log -1 --format=%s "$commit")

            echo "Checking: $message"

            if [[ ! "$message" =~ ^\[WKI-[0-9]+\] ]]; then
              echo "❌ Invalid commit message: $message"
              echo "Expected: [WKI-123] add payment service"
              exit 1
            fi
          done

      - name: Check PR title
        run: |
          title="${{ github.event.pull_request.title }}"
          
          echo "Checking PR title: $title"
          
          if [[ ! "$title" =~ ^\[WKI-[0-9]+\]$ ]]; then
            echo "❌ Invalid PR title: $title"
            echo "Expected: [WKI-123]"
            exit 1
          fi