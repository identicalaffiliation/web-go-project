name: check_commits_and_prs

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - '**'

jobs:
  commit-check:
    name: Check commit messages
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            commits=$(git rev-list \
              ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          else
            commits=$(git rev-list \
              ${{ github.event.before }}..${{ github.sha }})
          fi

          for commit in $commits; do
            message=$(git log -1 --format=%s "$commit")

            echo "Checking: $message"

            if [[ ! "$message" =~ ^\[WKI-[0-9]+\] ]]; then
              echo "Invalid commit message: $message"
              echo "Commit must start with [WKI-№]"
              echo "Example: [WKI-123] add payment service"
              exit 1
            fi
          done